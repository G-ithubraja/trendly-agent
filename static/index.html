<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trendly Support Agent</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  #log { border: 1px solid #ddd; border-radius: 8px; height: 420px; overflow-y: auto; padding: 12px; margin-bottom: 12px; }
  .msg { margin-bottom: 10px; line-height: 1.4; }
  .user { text-align: right; color: #1a56db; }
  .agent { text-align: left; color: #111; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 8px; font-size: 14px; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
<h2>Trendly Support Agent (dev preview)</h2>
<div id="log"></div>
<form id="form">
  <input id="input" placeholder="e.g. What's the status of order 1001?" autocomplete="off" />
  <button type="submit">Send</button>
</form>

<script>
const sessionId = crypto.randomUUID();
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');

function append(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = (role === 'user' ? 'You: ' : 'Agent: ') + text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  append('user', message);
  input.value = '';
  append('agent', '...');
  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message }),
  });
  const data = await res.json();
  log.lastChild.textContent = 'Agent: ' + (data.reply || data.error || 'Error');
});
</script>
</body>
</html>
