<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trendly — Customer Care</title>
<link rel="shortcut icon" href="Trendly.jpeg" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #221F1C;
    --paper: #F7F4EF;
    --plum: #6E2A39;
    --plum-dark: #551F2A;
    --sand: #E4DACB;
    --gold: #B8974E;
    --line: rgba(34,31,28,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 640px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 28px 20px 18px;
  }
  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.01em;
  }
  .wordmark em {
    font-style: italic;
    font-weight: 500;
    color: var(--plum);
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(34,31,28,0.55);
    margin-top: 2px;
  }
  .stitch {
    height: 1px;
    background: repeating-linear-gradient(
      to right, var(--gold) 0 6px, transparent 6px 11px
    );
    margin-top: 16px;
  }
  #log {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .row.agent { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 12px 15px;
    line-height: 1.5;
    font-size: 15px;
  }
  .row.user .bubble {
    background: var(--plum);
    color: var(--paper);
    border-radius: 14px 14px 3px 14px;
  }
  .row.agent .bubble {
    background: var(--sand);
    color: var(--ink);
    border-radius: 14px 14px 14px 3px;
  }
  .row.agent .avatar {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .row.agent { align-items: flex-end; }

  .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    border: 1px solid var(--ink);
    border-radius: 3px;
    padding: 1px 6px 1px 12px;
    margin: 0 1px;
    display: inline-block;
    position: relative;
    background: var(--paper);
  }
  .tag::before {
    content: '';
    position: absolute;
    left: 5px; top: 50%;
    width: 3px; height: 3px;
    background: var(--ink);
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .row.user .tag {
    border-color: var(--paper);
    background: var(--plum-dark);
    color: var(--paper);
  }
  .row.user .tag::before { background: var(--paper); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink); opacity: 0.35;
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
    30% { transform: translateY(-4px); opacity: 0.9; }
  }

  .chips {
    display: flex;
    gap: 8px;
    padding: 0 20px 12px;
    overflow-x: auto;
  }
  .chip {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    white-space: nowrap;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .chip:hover { background: var(--sand); border-color: var(--ink); }

  form#composer {
    display: flex;
    gap: 10px;
    padding: 14px 20px 22px;
    border-top: 1px solid var(--line);
  }
  #input {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: white;
    color: var(--ink);
  }
  #input:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  button#send {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    background: var(--plum);
    color: var(--paper);
    cursor: pointer;
  }
  button#send:hover { background: var(--plum-dark); }
  button#send:disabled { opacity: 0.5; cursor: default; }

  @media (max-width: 420px) {
    .wordmark { font-size: 26px; }
    .bubble { max-width: 86%; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="wordmark">trendly<em>.</em></div>
    <div class="eyebrow">Customer Care — Dev Preview</div>
    <div class="stitch"></div>
  </header>

  <div id="log"></div>

  <div class="chips">
    <button class="chip" data-msg="What's the status of order TR-4521?">Order status</button>
    <button class="chip" data-msg="Can I return order TR-4530?">Start a return</button>
    <button class="chip" data-msg="How long do I have to return something?">Return policy</button>
    <button class="chip" data-msg="Can you give me a discount?">Ask for discount</button>
  </div>

  <form id="composer">
    <input id="input" placeholder="Ask about an order, return, or policy…" autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
const sessionId = crypto.randomUUID();
const log = document.getElementById('log');
const form = document.getElementById('composer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

// Turn order IDs (TR-1234) and ticket IDs (TCK-12345) into garment-tag badges.
function tagify(text) {
  const escaped = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return escaped.replace(/\b(TR-\d{3,6}|TCK-\d{3,6})\b/g, '<span class="tag">$1</span>');
}

function addBubble(role, text, isTyping) {
  const row = document.createElement('div');
  row.className = 'row ' + role;

  if (role === 'agent') {
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'T';
    row.appendChild(avatar);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (isTyping) {
    bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  } else {
    bubble.innerHTML = tagify(text);
  }
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

async function sendMessage(message) {
  if (!message.trim()) return;
  input.value = '';
  sendBtn.disabled = true;
  addBubble('user', message);
  const typingBubble = addBubble('agent', '', true);

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    const data = await res.json();
    typingBubble.innerHTML = tagify(data.reply || data.error || 'Something went wrong — please try again.');
  } catch (err) {
    typingBubble.innerHTML = tagify('Connection error — please try again.');
  } finally {
    sendBtn.disabled = false;
    log.scrollTop = log.scrollHeight;
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  sendMessage(input.value);
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => sendMessage(chip.dataset.msg));
});

addBubble('agent', "Hi, I'm Trendly's support assistant. Ask me about an order, a return, or our shipping policy.");
</script>
</body>
</html>
